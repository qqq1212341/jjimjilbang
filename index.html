  <!-- ═══ 공장 기본값 3종 — 이 순서가 계약이다 ══════════════════════════════════
       ★ 여기 있는 세 줄은 **새 게임이 base 를 복제하면 딸려오라고** 둔 것이다.
         예전엔 이게 게임에만 있어서, 복제한 게임이 스플래시·계측·다국어를 통째로
         빠뜨린 채 출시 직전까지 갔다(PCAlba 스플래시 누락이 그 경로였다).
         지우지 마라. 필요 없으면 그 게임에서 빼되, 뺐다는 걸 알고 빼라.

       ① 스튜디오 스플래시 — 모든 DGL 게임 공통 필수(CLAUDE.md).
          <head> 맨 앞이어야 게임이 뜨기 전에 브랜드 인트로가 먼저 나온다. 의존성 0 드롭인.
          ※ 에셋은 레포 비대를 피하려고 base 에 안 넣었다 — 게임을 만들 때
            `core/brand/splash/` 에서 `assets/dgl-splash.png` · `assets/audio/dgl-splash.mp3`
            로 복사한다(BUILD-ORDER §4 '복사해서 쓰는 것'). 없으면 스플래시는 조용히 건너뛴다.
       ② 계측(GA4) — 플레이어 행동 데이터. splash 다음, 게임 모듈보다 먼저.
          측정 ID 는 DGL 공용이고 게임 구분은 analytics.js 안의 GAME 슬러그로 한다.
          ※ 새 게임은 그 슬러그를 **반드시** 바꿔라(안 바꾸면 남의 게임 지표에 섞인다).
       ③ 다국어 — 게임 모듈보다 **먼저** 실행돼야 한다(i18n-playbook §4).
          시설표·대사표가 모듈 최상위에서 __t() 를 부르므로 사전이 그 전에 메모리에 있어야
          하고, 그건 동기 <script> 로만 보장된다. type=module 은 defer 라 항상 이 뒤에 돈다
          — 순서가 공짜로 맞는다.
       ══════════════════════════════════════════════════════════════════════════ -->

  <style>
    html, body { margin: 0; padding: 0; background: #0d0e12; height: 100%; overflow: hidden; touch-action: none; }
    /* 앱이지 웹페이지가 아니다 — 누를 때 파란 번쩍임·길게 누를 때 글자 선택·화면을 끌 때 긁힘·iOS 말풍선을 뿌리에서 끈다.

    *, *::before, *::after { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
    /* 데스크톱에서 폰 캔버스가 통째로 확대되어 '화면이 너무 큰' 문제 → 폭을 폰 수준으로 캡 */

    html.dgl-native-android { --dgl-safe-top: max(24px, env(safe-area-inset-top)); }
    canvas { display: block; }

  <style>
    /* ★★ **한국어 게임 폰트** — 2026-07-21 사장님 확정. 시스템 고딕·Pretendard 금지.
         메인 = ONE Mobile POP(버튼·라벨·HUD·제목) · 보조 = NEXON Lv.1 고딕(숫자·긴 안내문).
         스택 선언은 `src/data/fonts.ts` 의 FONT_GAME/FONT_TEXT 이고, **여기가 그 짝**이다.

       ★ 이 선언이 빠지면 **아무도 못 잡는다** (2026-08-16 실사고):
         스택은 멀쩡하고 OTF 도 번들에 들어 있는데 `@font-face` 가 없어서 브라우저가
         파일을 **요청조차 안 한다** → 전 화면이 조용히 OS 고딕으로 떨어진다.
         글자는 멀쩡히 읽히므로 스크린샷을 봐도 모른다. PCAlba 재제작본이 그 상태였다.
         base 에 두는 이유가 그것이다 — 복제해 만드는 다음 게임이 같은 구멍을 물고 가면 안 된다.

       ★ woff2 변환·서브셋 **금지**: 두 폰트 다 '배포된 형태 그대로' 조항이 있어 OTF 원본을
         그대로 번들한다(라이선스 전문 = assets/fonts/FONT-LICENSES.md — 넥슨이 저작권 안내
         포함을 요구한다). 새 게임을 만들 때 `core/brand/fonts/` 에서 세 파일 + 라이선스를
         `public/assets/fonts/` 로 복사할 것. */
    @font-face {
      font-family: 'ONE Mobile POP';
      src: url('assets/fonts/ONEMobilePOP.otf') format('opentype');
      font-display: block;
      /* ★★ **POP 의 빈 글리프 넷을 뺀다** — `—`(U+2014) `–`(U+2013) `•`(U+2022) `✖`(U+2716).
         cmap 에는 **있는데 외곽선이 비어 있다**(bounds=None). 그래서 브라우저는 "이 폰트에
         있다"고 판단해 **폴백을 안 하고 빈칸을 찍는다** — 없는 것보다 있는 게 더 나쁜 경우다.
         라이브(prototype/css/style.css)는 2026-07-23 에 이걸 넣었는데 **재제작본에는 안 왔고**,
         그래서 새 빌드는 문장의 대시가 통째로 사라진 채 돌고 있었다("일이 2건 밀렸어요
         직원이 필요해요" — 사장님 2026-08-21 스크린샷). 폰트 파일은 손대지 않는다(라이선스). */
      unicode-range: U+0-2012, U+2015-2021, U+2023-2715, U+2717-10FFFF;
    }
    @font-face {
      font-family: 'NEXON Lv1 Gothic';
      src: url('assets/fonts/NEXONLv1GothicLow.otf') format('opentype');
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'NEXON Lv1 Gothic';
      src: url('assets/fonts/NEXONLv1GothicLow-Bold.otf') format('opentype');
      font-weight: 700;
      font-display: block;
    }
  </style>
